<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="countdown.css">
    <link rel="stylesheet" href="organize.css">
    <title>整理桌面中</title>
</head>
<body>
    <div class="page-shell">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark">NEZHA</span>
                <span class="brand-sub">自动整理</span>
            </div>
            <div class="header-status" id="progressStatus">准备中...</div>
        </header>

        <main class="content-grid">
            <section class="card progress-card">
                <div class="progress-header">
                    <div class="progress-title">整理进度</div>
                    <div class="progress-percentage" id="progressPercentage">0%</div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-meta">
                    <div class="progress-meta-item">
                        <span class="meta-label">状态</span>
                        <span class="meta-value" id="progressMeta">准备中...</span>
                    </div>
                    <div class="progress-meta-item">
                        <span class="meta-label">模式</span>
                        <span class="meta-value">桌面整理</span>
                    </div>
                </div>
                <div class="completion-area" id="completeMessage" style="display: none;">
                    <div class="completion-icon">✓</div>
                    <div class="completion-text">整理完成</div>
                    <button class="completion-close" id="closeBtn">关闭窗口</button>
                </div>
            </section>

            <section class="card log-card">
                <div class="log-header">
                    <div class="log-title">整理动态</div>
                    <div class="log-tip">实时更新执行情况</div>
                </div>
                <div class="organize-logs" id="organizeLogs"></div>
            </section>
        </main>

        <div class="exit-hint">按 ESC 键退出</div>
    </div>

    <script src="organize.js"></script>
</body>
</html>
