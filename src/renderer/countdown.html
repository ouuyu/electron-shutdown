<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="countdown.css" />
    <title>系统关机中</title>
</head>
<body>
    <!-- 背景动态粒子 -->
    <canvas id="particleCanvas"></canvas>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="status-item">
                <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span id="currentTime"></span>
            </div>
            <div class="status-item">
                <svg class="status-icon pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v20M2 12h20"/>
                </svg>
                <span>系统自动关机</span>
            </div>
        </div>

        <!-- 中心倒计时 -->
        <div class="countdown-center">
            <!-- 动态圆环 -->
            <div class="circle-container">
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <circle class="progress-ring-bg" cx="100" cy="100" r="90" />
                    <circle class="progress-ring-circle" id="progressCircle" cx="100" cy="100" r="90" />
                </svg>
                
                <!-- 倒计时数字 -->
                <div class="countdown-number" id="countdownNumber">10</div>
                <div class="countdown-label">秒后关机</div>
            </div>

            <!-- 脉冲波纹效果 -->
            <div class="pulse-ring"></div>
            <div class="pulse-ring pulse-delay-1"></div>
            <div class="pulse-ring pulse-delay-2"></div>
        </div>

        <!-- 取消提示 -->
        <div class="cancel-hint" id="cancelHint">
            <div class="hint-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20z"/>
                    <path d="M8 12h8M12 8l4 4-4 4"/>
                </svg>
            </div>
            <p class="hint-text">拖拽鼠标或快速晃动取消关机</p>
            <div class="hint-progress" id="hintProgress">
                <div class="hint-progress-bar" id="shakeProgress"></div>
            </div>
        </div>
    </div>

    <!-- 取消成功动画 -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>
            <h2 class="success-title">已取消关机</h2>
            <p class="success-message">窗口即将关闭</p>
        </div>
    </div>

    <script src="countdown.js"></script>
</body>
</html>
