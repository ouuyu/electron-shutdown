<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="countdown.css">
    <link rel="stylesheet" href="organize.css">
    <title>整理桌面中</title>
</head>
<body>
    <div class="page-shell">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark">NEZHA</span>
                <span class="brand-sub">自动整理</span>
            </div>
            <div class="header-status" id="progressStatus">准备中...</div>
        </header>

        <main class="content-grid">
            <section class="card progress-card">
                <div class="progress-header">
                    <div class="progress-title">整理进度</div>
                    <div class="progress-percentage" id="progressPercentage">0%</div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-meta">
                    <div class="progress-meta-item">
                        <span class="meta-label">状态</span>
                        <span class="meta-value" id="progressMeta">准备中...</span>
                    </div>
                    <div class="progress-meta-item">
                        <span class="meta-label">模式</span>
                        <span class="meta-value">桌面整理</span>
                    </div>
                </div>
                <div class="completion-area" id="completeMessage" style="display: none;">
                    <div class="completion-icon">✓</div>
                    <div class="completion-text">整理完成</div>
                    <button class="completion-close" id="closeBtn">关闭窗口</button>
                </div>
            </section>

            <section class="card log-card">
                <div class="log-header">
                    <div class="log-title">整理动态</div>
                    <div class="log-tip">实时更新执行情况</div>
                </div>
                <div class="organize-logs" id="organizeLogs"></div>
            </section>
        </main>

        <!-- 关机倒计时区域 -->
        <section class="shutdown-countdown-section">
            <div class="countdown-card">
                <div class="countdown-card-header">
                    <div class="countdown-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div class="countdown-info">
                        <div class="countdown-title">关机倒计时</div>
                        <div class="countdown-subtitle">整理完成后自动关机</div>
                    </div>
                    <div class="countdown-display">
                        <div class="countdown-number" id="shutdownCountdown">--</div>
                        <div class="countdown-unit">秒</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 滑动取消关机 -->
        <section class="slide-to-cancel">
            <div class="slide-shell">
                <div class="slide-header">
                    <div class="slide-icon-left">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 12h8M12 8l4 4-4 4"/>
                        </svg>
                    </div>
                    <div class="slide-text-group">
                        <div class="slide-label" id="slideText">向左滑动取消关机</div>
                        <div class="slide-hint">滑动至左侧即可取消</div>
                    </div>
                </div>
                
                <div class="slide-track">
                    <div class="slide-track-fill" id="slideProgress"></div>
                    <div class="slide-instructions">
                        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        <span class="slide-text">滑动取消</span>
                    </div>
                    <button class="slide-button" id="slideButton" aria-label="滑动取消关机">
                        <div class="slide-button-inner">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 18l-6-6 6-6"/>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script src="countdown.js"></script>
    <script src="organize.js"></script>
</body>
</html>
