<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="countdown.css">
    <link rel="stylesheet" href="organize.css">
    <title>整理桌面中</title>
</head>
<body>
    <div class="page-shell">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark">NEZHA</span>
                <span class="brand-sub">自动整理</span>
            </div>
            <div class="header-status" id="progressStatus">准备中...</div>
        </header>

        <main class="content-grid">
            <section class="card progress-card">
                <div class="progress-header">
                    <div class="progress-title">整理进度</div>
                    <div class="progress-percentage" id="progressPercentage">0%</div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-meta">
                    <div class="progress-meta-item">
                        <span class="meta-label">状态</span>
                        <span class="meta-value" id="progressMeta">准备中...</span>
                    </div>
                    <div class="progress-meta-item">
                        <span class="meta-label">模式</span>
                        <span class="meta-value">桌面整理</span>
                    </div>
                </div>
            </section>

            <section class="card log-card">
                <div class="log-header">
                    <div class="log-title">整理动态</div>
                    <div class="log-tip">实时更新执行情况</div>
                </div>
                <div class="organize-logs" id="organizeLogs"></div>
            </section>
        </main>

        <section class="slide-to-cancel">
            <div class="slide-shell">
                <div class="slide-label" id="slideText">向左滑动取消关机</div>
                <div class="slide-track">
                    <div class="slide-track-background"></div>
                    <div class="slide-track-progress" id="slideProgress"></div>
                    <button class="slide-button" id="slideButton" aria-label="取消关机">
                        <span class="slide-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </button>
                </div>
                <div class="slide-hint">滑动保持以安全取消关机</div>
            </div>
        </section>
    </div>

    <div class="hold-prompt" id="holdPrompt">
        <div class="hold-prompt-content">
            <div class="hold-prompt-title">保持滑动</div>
            <div class="hold-prompt-subtitle">继续保持以取消关机</div>
            <div class="hold-prompt-timer" id="holdTimer">2.0</div>
            <div class="hold-prompt-progress">
                <div class="hold-prompt-progress-bar" id="holdProgressBar"></div>
            </div>
        </div>
    </div>

    <script src="countdown.js"></script>
    <script src="organize.js"></script>
</body>
</html>
